<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c12">
  <title>Voz Raul - Visual</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f11;
      --text: #e0e0e0;
      --muted: #96969e;
      --accent: #d2d2d6;
    }

    * { box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: var(--text);
      background: #0d0d0f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { position: relative; width: 100vw; height: 100vh; margin: 0; }
    
    .topbar { 
      position: absolute; 
      z-index: 3; 
      top: 22px; 
      left: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 16px; 
      transform: translateX(-50%); 
    }
    
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; color: #08110e; background: var(--accent); font-size: 20px; font-weight: 800; box-shadow: 0 0 28px rgba(103,232,181,.16); }
    h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 1.65rem); letter-spacing: -.02em; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: .83rem; text-align: center; }

    .workspace { position: absolute; inset: 0; min-height: 0; }
    
    #city-background { 
      position: fixed; 
      z-index: 0; 
      inset: 0; 
      width: 100vw; 
      height: 100vh; 
      background-image: linear-gradient(rgba(0, 0, 0, .4), rgba(0, 0, 0, .6)), url("Favela.avif"); 
      background-size: cover; 
      background-position: center; 
      background-repeat: no-repeat; 
      pointer-events: none; 
    }

    .left-panel { position: absolute; z-index: 2; inset: 0; display: block; height: 100%; background: transparent; }

    .nina-stage { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; }
    .nina-avatar { 
      position: absolute; 
      z-index: 2; 
      top: 50%; 
      left: 50%; 
      display: block; 
      width: auto; 
      height: 80vh; 
      max-width: 95vw; 
      max-height: 850px; 
      object-fit: contain; 
      transform: translate3d(-50%, -50%, 0); 
      will-change: transform; 
      animation: ninaFloat 4.8s ease-in-out infinite; 
      cursor: pointer;
    }
    
    .nina-label { 
      position: absolute; 
      z-index: 2; 
      bottom: 24px; 
      color: var(--muted); 
      font-size: .85rem; 
      letter-spacing: .08em; 
      text-transform: uppercase; 
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    
    #oranges-background { position: absolute; z-index: 1; inset: 0; overflow: hidden; pointer-events: none; }
    .floating-orange { position: absolute; z-index: 1; width: clamp(110px, 10vw, 160px); aspect-ratio: 1; object-fit: contain; opacity: .76; animation: floatOrange 6s ease-in-out infinite; }
    .floating-orange.one { top: 10%; left: 8%; }
    .floating-orange.two { top: 25%; right: 28%; width: 125px; animation-delay: 1.5s; }
    .floating-orange.three { right: 8%; bottom: 16%; animation-delay: 3s; }
    .floating-orange.four { bottom: 10%; left: 20%; width: 140px; animation-delay: 4.5s; }
    .floating-orange.five { top: 17%; right: 8%; width: 115px; animation-delay: 6s; }
    .floating-orange.six { bottom: 28%; left: 7%; width: 130px; animation-delay: 7.5s; }
    .floating-orange.seven { top: 7%; left: 42%; width: 100px; animation-delay: 9s; }

    @keyframes floatOrange { 0%, 100% { transform: translate3d(0, 0, 0) rotate(-4deg) scale(1); } 50% { transform: translate3d(0, -14px, 0) rotate(5deg) scale(1.035); } }
    @keyframes ninaFloat { 0%, 100% { transform: translate3d(-50%, -50%, 0) translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(-50%, -50%, 0) translate3d(0, -12px, 0) scale(1.012); } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">◉</div>
        <div>
          <h1>Raul</h1>
          <p class="subtitle">Clique nele para ouvir</p>
        </div>
      </div>
    </header>

    <section class="workspace" aria-label="Animação do Raul">
      <div id="city-background" aria-hidden="true"></div>
      
      <div id="oranges-background" aria-hidden="true">
        <img class="floating-orange one" src="laranja.png" alt="">
        <img class="floating-orange two" src="laranja.png" alt="">
        <img class="floating-orange three" src="laranja.png" alt="">
        <img class="floating-orange four" src="laranja.png" alt="">
        <img class="floating-orange five" src="laranja.png" alt="">
        <img class="floating-orange six" src="laranja.png" alt="">
        <img class="floating-orange seven" src="laranja.png" alt="">
      </div>

      <div class="left-panel">
        <div class="nina-stage" aria-label="Avatar do Raul">
          <img class="nina-avatar" id="ninaAvatar" src="boca aberta olho aberto.png" alt="Raul" draggable="false" title="Clique para ouvir o Raul">
          <div class="nina-label">Líder Raul</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const ninaAvatar = document.getElementById("ninaAvatar");
    let blinkTimer;
    let mouthTimer;
    let isSpeaking = false;

    // Simula a piscadela de olhos
    function scheduleBlink() {
      clearInterval(blinkTimer);
      blinkTimer = setInterval(() => {
        if (isSpeaking) return; // Não pisca no meio da fala para não sobrepor
        ninaAvatar.src = "boca aberta olho fechado.png";
        setTimeout(() => { 
          if (!isSpeaking) ninaAvatar.src = "boca aberta olho aberto.png"; 
        }, 180);
      }, 3500);
    }

    // Função de fala nativa do navegador
    function speak(phrase) {
      if (!window.speechSynthesis) return;

      window.speechSynthesis.cancel(); // Cancela falas anteriores
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.lang = "pt-BR";
      utterance.rate = 1.1;

      utterance.onstart = () => {
        isSpeaking = true;
        // Alterna entre boca aberta normal e abertona enquanto fala
        mouthTimer = setInterval(() => {
          ninaAvatar.src = ninaAvatar.src.includes("Boca%20abertona.png") || ninaAvatar.src.includes("Boca abertona.png")
            ? "boca aberta olho aberto.png"
            : "Boca abertona.png";
        }, 200);
      };

      utterance.onend = () => {
        isSpeaking = false;
        clearInterval(mouthTimer);
        ninaAvatar.src = "boca aberta olho aberto.png";
      };

      utterance.onerror = () => {
        isSpeaking = false;
        clearInterval(mouthTimer);
        ninaAvatar.src = "boca aberta olho aberto.png";
      };

      window.speechSynthesis.speak(utterance);
    }

    // Clique no avatar dispara a fala
    ninaAvatar.addEventListener("click", () => {
      speak("Meu nome é Raul");
    });

    // Iniciar a animação de piscar
    scheduleBlink();
  </script>
</body>
</html>
